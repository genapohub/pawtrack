<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S1 注册登录 — 宠迹 UI 原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'PingFang SC',sans-serif; }
  body { background:#e8eaee; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .stage { display:flex; gap:32px; align-items:center; }
  .meta { width:280px; }
  .meta h1 { font-size:20px; margin-bottom:12px; }
  .meta .tag { display:inline-block; background:#3D6CF5; color:#fff; font-size:12px; padding:3px 10px; border-radius:999px; margin-bottom:10px; }
  .meta p { font-size:13px; color:#555; line-height:1.8; }
  .meta .nav { margin-top:16px; font-size:13px; }
  .meta .nav a { color:#3D6CF5; text-decoration:none; margin-right:12px; }
  .phone { width:375px; height:780px; background:#fff; border-radius:40px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.25); position:relative; border:8px solid #1c1c1e; }
  .statusbar { height:44px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:13px; font-weight:600; }
  .navbar { height:48px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; background:#fff; position:relative; }
  .navbar .back { position:absolute; left:16px; font-size:22px; color:#333; cursor:pointer; }
  .content { padding:30px 24px; }
  .logo { text-align:center; margin-bottom:36px; }
  .logo .icon { font-size:64px; }
  .logo .name { font-size:22px; font-weight:700; margin-top:8px; }
  .logo .desc { font-size:13px; color:#999; margin-top:4px; }
  .tabs { display:flex; background:#F0F1F5; border-radius:10px; padding:4px; margin-bottom:28px; }
  .tabs div { flex:1; text-align:center; padding:10px; border-radius:8px; font-size:14px; font-weight:600; color:#888; }
  .tabs div.active { background:#fff; color:#3D6CF5; box-shadow:0 2px 6px rgba(0,0,0,.06); }
  .field { margin-bottom:20px; }
  .field label { display:block; font-size:12px; color:#888; margin-bottom:6px; }
  .field input { width:100%; background:#F6F7FB; border:none; border-radius:10px; padding:14px 16px; font-size:15px; outline:none; }
  .code-row { display:flex; gap:10px; }
  .code-row input { flex:1; }
  .code-btn { white-space:nowrap; display:flex; align-items:center; padding:0 16px; border-radius:10px; border:1.5px solid #3D6CF5; color:#3D6CF5; font-size:13px; font-weight:600; }
  .primary-btn { width:100%; background:linear-gradient(135deg,#5B8CFF,#3D6CF5); color:#fff; border:none; border-radius:24px; padding:15px; font-size:16px; font-weight:600; margin-top:8px; cursor:pointer; }
  .divider { display:flex; align-items:center; gap:12px; margin:28px 0; }
  .divider span { flex:1; height:1px; background:#EDEEF2; }
  .divider i { font-size:12px; color:#999; font-style:normal; }
  .wx { text-align:center; }
  .wx .circle { width:56px; height:56px; border-radius:50%; background:#07C160; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; }
  .wx p { font-size:12px; color:#888; margin-top:8px; }
  .agreement { position:absolute; bottom:28px; left:0; right:0; text-align:center; font-size:11px; color:#aaa; }
  .prd-ref { margin-top:20px; background:#FFF7ED; border-left:3px solid #F59E0B; padding:12px; border-radius:6px; font-size:12px; color:#92400E; line-height:1.7; }
</style>
</head>
<body>
<div class="stage">
  <div class="meta">
    <span class="tag">P0 · Flow 1 注册激活</span>
    <h1>S1 注册登录</h1>
    <p>手机号/微信/Apple ID 登录，支持一键登录和验证码登录，新用户引导添加宠物。</p>
    <div class="prd-ref">📋 PRD 参考：S1 注册登录（P0）— 支持一键登录和验证码登录，新用户引导添加宠物</div>
    <div class="nav"><a href="s2-map.html">下一屏 S2 →</a></div>
  </div>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>
    <div class="navbar"><span class="back">‹</span>欢迎</div>
    <div class="content">
      <div class="logo">
        <div class="icon">🐾</div>
        <div class="name">宠迹 PawTrack</div>
        <div class="desc">宠物智能定位与社交平台</div>
      </div>
      <div class="tabs"><div class="active">登录</div><div>注册</div></div>
      <div class="field">
        <label>手机号</label>
        <input placeholder="请输入手机号" value="138 0013 8000">
      </div>
      <div class="field">
        <label>验证码</label>
        <div class="code-row">
          <input placeholder="请输入验证码" value="1234">
          <div class="code-btn">获取验证码</div>
        </div>
      </div>
      <button class="primary-btn">登 录</button>
      <div class="divider"><span></span><i>其他登录方式</i><span></span></div>
      <div class="wx">
        <div class="circle">💬</div>
        <p>微信一键登录</p>
      </div>
    </div>
    <div class="agreement">登录即代表同意《用户协议》和《隐私政策》</div>
  </div>
</div>






<script>
(function(){
  function showTip(msg){
    var t=document.createElement('div');
    t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(31,35,41,.92);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:9999;transition:opacity .3s';
    t.textContent=msg;document.body.appendChild(t);
    setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},300)},1600);
  }
  function navTo(file){
    // 第一优先：自动打开新标签页
    var w = null;
    try { w = window.open(file, '_blank'); } catch(err){}
    // 新标签被拦截 → 退回当前页跳转
    if (!w) {
      try { window.location.href = file; } catch(e2){}
      setTimeout(function(){
        var w2 = null;
        try { w2 = window.open(file, '_blank'); } catch(err2){}
        if (!w2) showTip('预览器拦截了跳转，请在浏览器中打开');
      }, 400);
    }
  }
  var NAV_MAP = {
    '会员中心':'s19-membership.html',
    '立即开通':'s19-membership.html',
    '升级 Pro':'s19-membership.html',
    'Pro':'s19-membership.html',
    '积分商城':'s20-points-shop.html',
    '我的积分':'s20-points-shop.html',
    '积分明细':'s21-points-detail.html',
    '邀请好友':'s24-invite.html',
    '设备管理':'s25-device-manage.html',
    '查找设备':'s25-device-manage.html',
    '固件':'s25-device-manage.html',
    '通知设置':'s23-notify-settings.html',
    '免打扰':'s23-notify-settings.html',
    '设置':'s26-settings.html',
    '退出登录':'s26-settings.html',
    '历史轨迹':'s7-history.html',
    '附近宠物':'s8-nearby.html',
    '报警设置':'s9-alarm-settings.html',
    '电子围栏报警':'s9-alarm-settings.html',
    '自定义围栏':'s10-fence-custom.html',
    '围栏':'s10-fence-custom.html',
    '报警通知':'s11-alarm-notify.html',
    '设备状态':'s12-device-status.html',
    '宠物社交':'s13-social-home.html',
    '发起碰头':'s15-meet-start.html',
    '碰头记录':'s13-social-home.html',
    '好朋狗':'s14-friend-list.html',
    '添加宠物':'s3-add-pet.html',
    '绑定':'s4-bind-device.html',
    '宠物列表':'s5-pet-list.html',
    '我的宠物':'s5-pet-list.html',
    '编辑':'s6-pet-detail.html'
  };
  document.querySelectorAll('.menu-item,.cell,.meet-btn,.nav-icon,.ex-btn,.mini-btn,.link,.plus,.edit,.outline-btn,.date-bar .date,.shop-item,.switch-row,.nearby-row,.plan-card').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var txt=el.textContent||'';
      for(var k in NAV_MAP){
        if(txt.indexOf(k)>-1){navTo(NAV_MAP[k]);return;}
      }
      showTip('原型演示：该入口暂未绑定跳转');
    });
  });
  document.querySelectorAll('.primary-btn,.danger-btn,.btn-main').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var txt=el.textContent||'';
      for(var k in NAV_MAP){
        if(txt.indexOf(k)>-1){navTo(NAV_MAP[k]);return;}
      }
      showTip('原型演示：操作未绑定');
    });
  });
  document.querySelectorAll('.nav a[href$=".html"]').forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      navTo(a.getAttribute('href'));
    });
  });
})();
</script>
</body>
</html>

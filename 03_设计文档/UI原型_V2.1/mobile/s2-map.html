<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S2 地图首页 — 宠迹 UI 原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'PingFang SC',sans-serif; }
  body { background:#e8eaee; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .stage { display:flex; gap:32px; align-items:center; }
  .meta { width:280px; }
  .meta h1 { font-size:20px; margin-bottom:12px; }
  .meta .tag { display:inline-block; background:#3D6CF5; color:#fff; font-size:12px; padding:3px 10px; border-radius:999px; margin-bottom:10px; }
  .meta p { font-size:13px; color:#555; line-height:1.8; }
  .meta .nav { margin-top:16px; font-size:13px; }
  .meta .nav a { color:#3D6CF5; text-decoration:none; margin-right:12px; }
  .phone { width:375px; height:780px; background:#EAF2EA; border-radius:40px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.25); position:relative; border:8px solid #1c1c1e; }
  .statusbar { height:44px; background:transparent; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:13px; font-weight:600; position:absolute; top:0; left:0; right:0; z-index:5; color:#1c1c1e; }
  .topbar { position:absolute; top:52px; left:16px; right:16px; z-index:5; display:flex; align-items:center; gap:10px; }
  .search { flex:1; background:rgba(255,255,255,.95); border-radius:12px; padding:11px 16px; font-size:13px; color:#888; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .alarm-icon { width:40px; height:40px; background:#fff; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .map { position:absolute; top:0; left:0; right:0; bottom:64px; }
  .map .road { position:absolute; background:#fff; border-radius:4px; }
  .map .park { position:absolute; background:#CFE8C9; border-radius:8px; }
  .pin { position:absolute; transform:translate(-50%,-100%); text-align:center; z-index:3; }
  .pin .bubble { font-size:22px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
  .pin .label { font-size:10px; background:#fff; border-radius:6px; padding:2px 6px; margin-top:2px; box-shadow:0 1px 4px rgba(0,0,0,.15); white-space:nowrap; }
  .pin.dog .bubble { color:#3D6CF5; }
  .pin.cat .bubble { color:#F97316; }
  .pin.other .bubble { color:#9CA3AF; }
  .fence { position:absolute; width:150px; height:150px; border:2px dashed rgba(61,108,245,.5); border-radius:50%; background:rgba(61,108,245,.06); }
  .fab { position:absolute; right:20px; bottom:140px; width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#5B8CFF,#3D6CF5); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(61,108,245,.4); z-index:5; }
  .pet-card { position:absolute; left:16px; right:16px; bottom:80px; background:#fff; border-radius:16px; padding:14px 16px; z-index:5; box-shadow:0 4px 20px rgba(0,0,0,.12); display:flex; align-items:center; gap:12px; }
  .pet-avatar { width:46px; height:46px; border-radius:50%; background:#EFF6FF; display:flex; align-items:center; justify-content:center; font-size:24px; }
  .pet-info { flex:1; }
  .pet-info .name { font-size:15px; font-weight:700; }
  .pet-info .pos { font-size:12px; color:#888; margin-top:2px; }
  .online { font-size:11px; color:#22C55E; background:#F0FDF4; padding:3px 8px; border-radius:999px; }
  .tabbar { position:absolute; bottom:0; left:0; right:0; height:64px; background:#fff; display:flex; align-items:center; justify-content:space-around; z-index:10; border-top:1px solid #EDEEF2; }
  .tabbar .item { text-align:center; font-size:10px; color:#999; }
  .tabbar .item.active { color:#3D6CF5; }
  .tabbar .item .ic { font-size:20px; display:block; margin-bottom:2px; }
  .prd-ref { margin-top:20px; background:#FFF7ED; border-left:3px solid #F59E0B; padding:12px; border-radius:6px; font-size:12px; color:#92400E; line-height:1.7; }
</style>
</head>
<body>
<div class="stage">
  <div class="meta">
    <span class="tag">P0 · Flow 1 注册激活</span>
    <h1>S2 地图首页</h1>
    <p>实时定位展示 + 宠物状态 Pin。蓝色 Pin=狗狗，橙色 Pin=猫咪，灰色 Pin=附近宠物；右下角 FAB 添加宠物。</p>
    <div class="prd-ref">📋 PRD 参考：S2 地图首页（P0）— 蓝色Pin=狗狗 / 橙色Pin=猫咪 / 灰色Pin=附近宠物 / FAB 添加宠物</div>
    <div class="nav"><a href="s1-login.html">← S1</a><a href="s3-add-pet.html">下一屏 S3 →</a></div>
  </div>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>
    <div class="map">
      <div class="road" style="left:0;top:180px;width:100%;height:26px"></div>
      <div class="road" style="left:0;top:380px;width:100%;height:20px"></div>
      <div class="road" style="left:120px;top:0;width:24px;height:100%"></div>
      <div class="road" style="left:290px;top:0;width:18px;height:100%"></div>
      <div class="park" style="left:30px;top:240px;width:80px;height:90px"></div>
      <div class="park" style="left:200px;top:460px;width:100px;height:70px"></div>
      <div class="fence" style="left:150px;top:260px"></div>
      <div class="pin dog" style="left:225px;top:300px"><div class="bubble">🐶</div><div class="label">旺财 · 在家</div></div>
      <div class="pin cat" style="left:100px;top:480px"><div class="bubble">🐱</div><div class="label">咪咪 · 宅家</div></div>
      <div class="pin other" style="left:300px;top:560px"><div class="bubble">🐶</div><div class="label">附近宠物</div></div>
    </div>
    <div class="topbar">
      <div class="search">🔍 搜索地址 / 宠物</div>
      <div class="alarm-icon">🔔</div>
    </div>
    <div class="fab">＋</div>
    <div class="pet-card">
      <div class="pet-avatar">🐶</div>
      <div class="pet-info">
        <div class="name">旺财 <span style="font-size:11px;color:#999;font-weight:400">· 金毛</span></div>
        <div class="pos">📍 郑州市金水区 · 30 秒前更新</div>
      </div>
      <div class="online">● 在线</div>
    </div>
    <div class="tabbar">
      <div class="item active"><span class="ic">🗺️</span>地图</div>
      <div class="item"><span class="ic">🐾</span>宠物</div>
      <div class="item"><span class="ic">🔔</span>报警</div>
      <div class="item"><span class="ic">👤</span>我的</div>
    </div>
  </div>
</div>

<script>
(function(){
  var NAV_MAP = {
    '会员中心':'s19-membership.html','立即开通':'s19-membership.html','升级 Pro':'s19-membership.html','Pro':'s19-membership.html',
    '积分商城':'s20-points-shop.html','我的积分':'s20-points-shop.html',
    '积分明细':'s21-points-detail.html','邀请好友':'s24-invite.html',
    '设备管理':'s25-device-manage.html','查找设备':'s25-device-manage.html','固件':'s25-device-manage.html',
    '通知设置':'s23-notify-settings.html','免打扰':'s23-notify-settings.html',
    '设置':'s26-settings.html','退出登录':'s26-settings.html',
    '历史轨迹':'s7-history.html','附近宠物':'s8-nearby.html',
    '报警设置':'s9-alarm-settings.html','电子围栏报警':'s9-alarm-settings.html',
    '自定义围栏':'s10-fence-custom.html','围栏':'s10-fence-custom.html',
    '报警通知':'s11-alarm-notify.html','设备状态':'s12-device-status.html',
    '宠物社交':'s13-social-home.html','发起碰头':'s15-meet-start.html','碰头记录':'s13-social-home.html',
    '好朋狗':'s14-friend-list.html','添加宠物':'s3-add-pet.html','绑定':'s4-bind-device.html',
    '宠物列表':'s5-pet-list.html','我的宠物':'s5-pet-list.html','编辑':'s6-pet-detail.html'
  };
  function showTip(msg){
    var t=document.createElement('div');
    t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(31,35,41,.92);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:9999;transition:opacity .3s';
    t.textContent=msg;document.body.appendChild(t);
    setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},300)},1600);
  }
  document.querySelectorAll('.menu-item,.cell,.meet-btn,.nav-icon,.ex-btn,.mini-btn,.link,.plus,.edit,.outline-btn,.date-bar .date,.shop-item,.switch-row,.nearby-row,.plan-card').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var txt=el.textContent||'';
      for(var k in NAV_MAP){
        if(txt.indexOf(k)>-1){location.href=NAV_MAP[k];return;}
      }
      showTip('原型演示：该入口暂未绑定跳转');
    });
  });
  document.querySelectorAll('.primary-btn,.danger-btn,.btn-main').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var txt=el.textContent||'';
      for(var k in NAV_MAP){
        if(txt.indexOf(k)>-1){location.href=NAV_MAP[k];return;}
      }
      showTip('原型演示：操作未绑定');
    });
  });
})();
</script>
</body>
</html>

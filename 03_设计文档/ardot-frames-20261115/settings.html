<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>设置</title><style>/* Pawtrack Tokens — independent of 宠宝树绿 / SKIN79墨 / 宠小满墨松绿 / RAG青绿 / Agent海军 */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --bg-muted:#EAEEF6; --border:#D8DEEA; --border-strong:#B4BCCE;
  --fg:#1C2430; --fg-2:#5A6472; --fg-3:#8B93A0; --fg-inv:#F4F6FB;
  --accent:#2B4F8A; --accent-hover:#234274; --accent-subtle:#E6ECF7;
  --mock:#8A5A12; --mock-bg:#F6EBD3; --mock-border:#E2C98A;
  --success:#2A7A4A; --success-subtle:#E3F3EA;
  --warning:#C07A1A; --warning-subtle:#F8EED8;
  --danger:#C0392B; --danger-subtle:#F8E6E4;
  --map:#D5DCEC; --map-line:#9AA8C4; --pin:#2B4F8A;
  --tab-bg:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E8EAEE;color:var(--fg);font-family:"PingFang SC",-apple-system,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
.app{position:relative;overflow:hidden;background:var(--bg);color:var(--fg)}
.phone{width:375px;height:812px;background:var(--bg);position:relative;overflow:hidden}
.sb{height:44px;padding:14px 20px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--fg);background:var(--surface)}
.nav{height:44px;padding:0 12px;display:flex;align-items:center;justify-content:center;background:var(--surface);border-bottom:1px solid var(--border);position:relative;font-size:17px;font-weight:600}
.nav .back{position:absolute;left:12px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.mock{background:var(--mock-bg);color:var(--mock);border-bottom:1px solid var(--mock-border);padding:7px 14px;font-size:11px;line-height:1.45;font-weight:500;text-align:center}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:68px;background:var(--tab-bg);border-top:1px solid var(--border);display:flex;padding:6px 0 10px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--fg-3);font-weight:500}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px}
.body{position:absolute;left:0;right:0;top:88px;bottom:68px;overflow:hidden}
.body.nontab{bottom:0;top:88px}
.body.hasmock{top:126px}
.pad{padding:14px 16px 24px}
h1,h2,h3{font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--fg-2);font-size:12px;line-height:1.5}
.tiny{color:var(--fg-3);font-size:11px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:600;background:var(--accent);color:#fff}
.btn[disabled]{opacity:.55}
.btn-ghost{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--fg-2);margin-bottom:6px;font-weight:500}
.input{width:100%;height:44px;border:1px solid var(--border);border-radius:10px;background:var(--bg-muted);padding:0 12px;font-size:15px;color:var(--fg);outline:none}
.banner{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;margin:10px 0}
.banner.err{background:var(--danger-subtle);color:var(--danger)}
.banner.warn{background:var(--warning-subtle);color:var(--warning)}
.banner.ok{background:var(--success-subtle);color:var(--success)}
.banner.info{background:var(--accent-subtle);color:var(--accent)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;background:var(--bg-muted);color:var(--fg-2)}
.tag.cat{background:var(--accent-subtle);color:var(--accent)}
.tag.dog{background:#EEE6DA;color:#6A4A28}
.tag.ok{background:var(--success-subtle);color:var(--success)}
.tag.off{background:var(--bg-muted);color:var(--fg-3)}
.tag.warn{background:var(--warning-subtle);color:var(--warning)}
.tag.err{background:var(--danger-subtle);color:var(--danger)}
.av{width:40px;height:40px;border-radius:12px;background:var(--accent-subtle);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
.map{height:220px;border-radius:12px;background:var(--map);position:relative;overflow:hidden;border:1px solid var(--border)}
.map .grid{position:absolute;inset:0;background-image:linear-gradient(var(--map-line) 1px,transparent 1px),linear-gradient(90deg,var(--map-line) 1px,transparent 1px);background-size:28px 28px;opacity:.28}
.map .fence{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border:2px dashed var(--accent);border-radius:50%;background:rgba(43,79,138,.08)}
.map .pin{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--pin);border:2px solid #fff;border-radius:50%}
.map .cap{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(28,36,48,.86);color:#fff;font-size:11px;padding:6px 8px;border-radius:8px;text-align:center}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bg-muted),#fff,var(--bg-muted));background-size:200% 100%;margin:8px 0}
.switch{width:40px;height:24px;border-radius:12px;background:var(--border-strong);position:relative;flex-shrink:0}
.switch.on{background:var(--accent)}
.switch.locked{background:var(--accent);opacity:.7}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff}
.switch.on i,.switch.locked i{left:18px}
.list-item{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.list-item:last-child{border-bottom:0}
.empty{text-align:center;padding:48px 24px;color:var(--fg-2);font-size:14px;line-height:1.6}
.cta-bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 20px;background:var(--surface);border-top:1px solid var(--border)}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px}
/* admin */
.admin{width:1440px;height:900px;display:flex;background:var(--bg)}
.aside{width:220px;background:#1B2433;color:var(--fg-inv);display:flex;flex-direction:column;padding:20px 12px}
.aside .brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px;border-bottom:1px solid #2A3548;margin-bottom:12px}
.aside .brand-name{font-weight:600;font-size:14px}
.aside .brand-sub{font-size:11px;color:#9AA4B5;margin-top:2px}
.aside a{display:block;padding:9px 10px;border-radius:8px;color:#C5CDD8;font-size:13px;font-weight:500;text-decoration:none;margin-bottom:2px}
.aside a.on{background:#2B4F8A;color:#fff}
.aside a.off{color:#6B7585}
.aside .foot{margin-top:auto;padding:10px 8px;font-size:11px;color:#9AA4B5;line-height:1.5}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.top h1{font-size:16px}
.content{padding:20px 24px;overflow:hidden}
.table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table th{text-align:left;font-size:12px;font-weight:500;color:var(--fg-2);background:var(--bg-muted);padding:10px 12px}
.table td{font-size:13px;padding:12px;border-top:1px solid var(--border)}
.login-wrap{width:1440px;height:900px;display:flex;background:var(--bg)}
.login-l{width:560px;background:var(--accent);color:#fff;padding:64px 48px}
.login-l h1{font-size:28px;font-weight:600;margin:16px 0 12px}
.login-l p{font-size:14px;line-height:1.7;color:#E6ECF7}
.login-r{flex:1;display:flex;align-items:center;justify-content:center}
.box{width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px}
.box h2{font-size:18px;margin-bottom:8px}
.cover{width:1200px;height:320px;background:var(--accent);color:#fff;padding:36px 48px;position:relative}
.cover h1{font-size:28px;font-weight:600;margin:8px 0 10px}
.cover p{font-size:14px;line-height:1.7;max-width:820px;color:#E6ECF7}
.cover .chip{display:inline-block;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}

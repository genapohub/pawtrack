# 宠迹 PawTrack — 基础设施编排（本地裸跑后端用）
# 仅启动 DB/Redis/MongoDB/RabbitMQ/EMQX，端口暴露到 localhost
# 用法：docker compose -f docker-compose.infra.yml up -d
# 然后在 backend/ 下裸跑：uvicorn app.main:app --reload
# 数据卷与 docker-compose.yml 共享（同名 volume），避免重复初始化

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pawtrack-postgres
    environment:
      POSTGRES_DB: pawtrack
      POSTGRES_USER: pawtrack
      POSTGRES_PASSWORD: pawtrack_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawtrack"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pawtrack-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: pawtrack-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: pawtrack
      MONGO_INITDB_ROOT_PASSWORD: pawtrack_dev
      MONGO_INITDB_DATABASE: pawtrack
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./docker/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pawtrack-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pawtrack
      RABBITMQ_DEFAULT_PASS: pawtrack_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx/emqx:5.8
    container_name: pawtrack-emqx
    environment:
      EMQX_NODE__name: emqx@127.0.0.1
      EMQX_CLUSTER__discovery_strategy: manual
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqxdata:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  mongodata:
  rabbitdata:
  emqxdata:

networks:
  default:
    name: pawtrack-network

<svg viewBox="0 0 1200 800" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="dogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2D4A6F;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="#F8FAFC"/>

  <!-- 标题 -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#1E293B">宠迹 PawTrack — 产品架构图</text>
  <text x="600" y="65" text-anchor="middle" font-size="14" fill="#64748B">硬件定位器 + App前端 + 后台管理系统 三位一体架构</text>

  <!-- 硬件层 -->
  <rect x="100" y="90" width="1000" height="80" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <text x="120" y="115" font-size="14" font-weight="700" fill="#3B82F6">硬件层</text>
  <text x="120" y="135" font-size="12" fill="#94A3B8">猫咪版：BLE+WiFi | ≤18g | 7-14天续航 | ¥149</text>
  <text x="120" y="155" font-size="12" fill="#94A3B8">狗狗版：GPS+4G | ≤32g | 3-7天续航 | ¥199 + ¥9.9/月</text>

  <!-- 箭头：硬件 → 前端 -->
  <line x1="600" y1="170" x2="600" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 前端层 -->
  <rect x="100" y="200" width="1000" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 前端标题 -->
  <rect x="100" y="200" width="1000" height="40" rx="12" fill="#1E293B"/>
  <text x="120" y="225" font-size="14" font-weight="700" fill="#FFFFFF">前端App（26屏 · 6大流程）</text>

  <!-- 6个流程模块 -->
  <!-- Flow 1: 注册激活 -->
  <rect x="120" y="260" width="140" height="60" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="190" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">注册激活</text>
  <text x="190" y="300" text-anchor="middle" font-size="11" fill="#64748B">S1-S4 · 4屏</text>
  <text x="190" y="315" text-anchor="middle" font-size="10" fill="#94A3B8">登录/地图/添加/绑定</text>

  <!-- Flow 2: 定位与状态 -->
  <rect x="280" y="260" width="140" height="60" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
  <text x="350" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">定位与状态</text>
  <text x="350" y="300" text-anchor="middle" font-size="11" fill="#64748B">S5-S8 · 4屏</text>
  <text x="350" y="315" text-anchor="middle" font-size="10" fill="#94A3B8">列表/详情/轨迹/附近</text>

  <!-- Flow 3: 安全报警 -->
  <rect x="440" y="260" width="140" height="60" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="510" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">安全报警</text>
  <text x="510" y="300" text-anchor="middle" font-size="11" fill="#64748B">S9-S12 · 4屏</text>
  <text x="510" y="315" text-anchor="middle" font-size="10" fill="#94A3B8">设置/围栏/通知/状态</text>

  <!-- Flow 4: 社交碰头 -->
  <rect x="600" y="260" width="140" height="60" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="670" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">社交碰头</text>
  <text x="670" y="300" text-anchor="middle" font-size="11" fill="#64748B">S13-S17 · 5屏</text>
  <text x="670" y="315" text-anchor="middle" font-size="10" fill="#94A3B8">首页/匹配/发起/寻找/成功</text>

  <!-- Flow 5: 商业变现 -->
  <rect x="760" y="260" width="140" height="60" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="830" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">商业变现</text>
  <text x="830" y="300" text-anchor="middle" font-size="11" fill="#64748B">S18-S21 · 4屏</text>
  <text x="830" y="315" text-anchor="middle" font-size="10" fill="#94A3B8">Pro/订阅/积分/明细</text>

  <!-- Flow 6: 个人中心 -->
  <rect x="920" y="260" width="140" height="60" rx="8" fill="#F0F9FF" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="990" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">个人中心</text>
  <text x="990" y="300" text-anchor="middle" font-size="11" fill="#64748B">S22-S26 · 5屏</text>
  <text x="990" y="315" text-anchor="middle" font-size="10" fill="#94A3B8">中心/通知/邀请/设备/设置</text>

  <!-- 猫狗差异化策略 -->
  <rect x="120" y="340" width="940" height="60" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="140" y="360" font-size="13" font-weight="700" fill="#F59E0B">猫狗差异化策略</text>
  <text x="140" y="380" font-size="11" fill="#1E293B">猫咪：默认开启离家报警（100m围栏）| 宅家状态 | 不参与碰头 | 报警优先级高</text>
  <text x="140" y="398" font-size="11" fill="#1E293B">狗狗：默认关闭报警（300m围栏）| 在家/户外状态 | 好朋狗匹配+碰头奖励 | 社交驱动</text>

  <!-- 箭头：前端 → 后台 -->
  <line x1="600" y1="480" x2="600" y2="510" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 后台层 -->
  <rect x="100" y="510" width="1000" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 后台标题 -->
  <rect x="100" y="510" width="1000" height="40" rx="12" fill="#1E293B"/>
  <text x="120" y="535" font-size="14" font-weight="700" fill="#FFFFFF">后台管理系统（9大模块 · 15屏）</text>

  <!-- 9个后台模块 -->
  <!-- 第一行 -->
  <rect x="120" y="570" width="100" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="170" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">数据概览</text>
  <text x="170" y="605" text-anchor="middle" font-size="10" fill="#64748B">Dashboard</text>

  <rect x="240" y="570" width="100" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="290" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">用户管理</text>
  <text x="290" y="605" text-anchor="middle" font-size="10" fill="#64748B">用户/封禁</text>

  <rect x="360" y="570" width="100" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="410" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">宠物管理</text>
  <text x="410" y="605" text-anchor="middle" font-size="10" fill="#64748B">档案/类型</text>

  <rect x="480" y="570" width="100" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="530" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">设备管理</text>
  <text x="530" y="605" text-anchor="middle" font-size="10" fill="#64748B">状态/固件</text>

  <rect x="600" y="570" width="100" height="50" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
  <text x="650" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">报警管理</text>
  <text x="650" y="605" text-anchor="middle" font-size="10" fill="#64748B">规则/记录</text>

  <rect x="720" y="570" width="100" height="50" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1"/>
  <text x="770" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">社交管理</text>
  <text x="770" y="605" text-anchor="middle" font-size="10" fill="#64748B">碰头/积分</text>

  <rect x="840" y="570" width="100" height="50" rx="6" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1"/>
  <text x="890" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">会员营收</text>
  <text x="890" y="605" text-anchor="middle" font-size="10" fill="#64748B">订单/统计</text>

  <rect x="960" y="570" width="100" height="50" rx="6" fill="#F0F9FF" stroke="#06B6D4" stroke-width="1"/>
  <text x="1010" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">内容管理</text>
  <text x="1010" y="605" text-anchor="middle" font-size="10" fill="#64748B">公告/Banner</text>

  <!-- 第二行 -->
  <rect x="120" y="640" width="100" height="50" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
  <text x="170" y="660" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">系统设置</text>
  <text x="170" y="675" text-anchor="middle" font-size="10" fill="#64748B">角色/日志</text>

  <rect x="240" y="640" width="100" height="50" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
  <text x="290" y="660" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">权限管理</text>
  <text x="290" y="675" text-anchor="middle" font-size="10" fill="#64748B">RBAC/4角色</text>

  <!-- 权限模型 -->
  <rect x="360" y="640" width="700" height="50" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="380" y="660" font-size="12" font-weight="700" fill="#F59E0B">权限模型：超管（全部）| 运营（用户/宠物/社交/内容）| 客服（用户/报警/订单）| 财务（会员营收）</text>
  <text x="380" y="678" font-size="11" fill="#1E293B">数据联动：前端操作 → 实时同步 → 后台监控 → 运营决策</text>

  <!-- 底部：商业模式 -->
  <rect x="100" y="730" width="1000" height="50" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="120" y="750" font-size="13" font-weight="700" fill="#10B981">三层变现模型</text>
  <text x="120" y="770" font-size="11" fill="#94A3B8">L1 硬件销售 40%（¥199）| L2 订阅服务 40%（¥19.9/月）| L3 增值生态 20%（保险/服务/SaaS）| 目标：18个月盈亏平衡</text>

</svg>
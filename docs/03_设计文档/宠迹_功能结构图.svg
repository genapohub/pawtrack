<svg viewBox="0 0 1400 900" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#F8FAFC"/>

  <!-- 标题 -->
  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#1E293B">宠迹 PawTrack — 功能结构图</text>
  <text x="700" y="65" text-anchor="middle" font-size="14" fill="#64748B">前端26屏 + 后台15屏 · 完整功能模块分解</text>

  <!-- 前端功能结构 -->
  <rect x="50" y="90" width="600" height="750" rx="16" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <rect x="50" y="90" width="600" height="50" rx="16" fill="#3B82F6"/>
  <text x="350" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">前端App功能结构（26屏）</text>

  <!-- Flow 1: 注册激活 -->
  <rect x="70" y="160" width="560" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="90" y="185" font-size="14" font-weight="700" fill="#1E293B">Flow 1 · 注册激活（4屏）</text>
  <text x="90" y="205" font-size="12" fill="#64748B">S1 注册登录：手机号/微信/Apple ID | 新用户引导添加宠物</text>
  <text x="90" y="225" font-size="12" fill="#64748B">S2 地图首页：实时定位Pin（蓝=狗/橙=猫）| FAB添加宠物</text>
  <text x="90" y="245" font-size="12" fill="#64748B">S3 添加宠物：选择猫/狗+品种+名称 | 影响后续默认设置</text>

  <!-- Flow 2: 定位与状态 -->
  <rect x="70" y="270" width="560" height="90" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
  <text x="90" y="295" font-size="14" font-weight="700" fill="#1E293B">Flow 2 · 定位与状态（4屏）</text>
  <text x="90" y="315" font-size="12" fill="#64748B">S5 宠物列表Tab：狗狗"在家/户外" | 猫咪"宅家"状态标签</text>
  <text x="90" y="335" font-size="12" fill="#64748B">S6 宠物详情：设备状态+电量+报警快捷入口+Pro功能对比</text>
  <text x="90" y="355" font-size="12" fill="#64748B">S7 历史轨迹：时间轴+轨迹回放 | 免费7天/会员无限（转化触发）</text>

  <!-- Flow 3: 安全报警 -->
  <rect x="70" y="380" width="560" height="90" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="90" y="405" font-size="14" font-weight="700" fill="#1E293B">Flow 3 · 安全报警（4屏）</text>
  <text x="90" y="425" font-size="12" fill="#64748B">S9 报警设置：围栏开关+范围设置 | 猫默认开(100m)/狗默认关(300m)</text>
  <text x="90" y="445" font-size="12" fill="#64748B">S10 围栏自定义：地图拖拽编辑 | 圆心调整+半径滑块+实时预览</text>
  <text x="90" y="465" font-size="12" fill="#64748B">S11 报警通知：Push+App内+紧急联系人 | 猫咪立即报警/狗狗可选</text>

  <!-- Flow 4: 社交碰头 -->
  <rect x="70" y="490" width="560" height="90" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="90" y="515" font-size="14" font-weight="700" fill="#1E293B">Flow 4 · 社交碰头（5屏）</text>
  <text x="90" y="535" font-size="12" fill="#64748B">S13 社交首页：寻找好朋狗+碰头入口 | 附近活跃狗狗数量</text>
  <text x="90" y="555" font-size="12" fill="#64748B">S14 好朋狗列表：匹配度+距离+筛选 | 按品种/距离/活跃度</text>
  <text x="90" y="575" font-size="12" fill="#64748B">S15 碰头开始：发起请求+距离校验(>50m) | S16 寻找中：实时距离倒计时</text>

  <!-- Flow 5: 商业变现 -->
  <rect x="70" y="600" width="560" height="90" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="90" y="625" font-size="14" font-weight="700" fill="#1E293B">Flow 5 · 商业变现（4屏）</text>
  <text x="90" y="645" font-size="12" fill="#64748B">S18 Pro入口：多触点（地图/详情/轨迹/我的）| 功能限制触发升级</text>
  <text x="90" y="665" font-size="12" fill="#64748B">S19 会员订阅：三档定价 | 基础¥19.9/月 Pro¥29.9/月 年付8.3折</text>
  <text x="90" y="685" font-size="12" fill="#64748B">S20 积分商城：兑换宠物用品/优惠券 | 积分来源：碰头+邀请+签到</text>

  <!-- Flow 6: 个人中心 -->
  <rect x="70" y="710" width="560" height="90" rx="10" fill="#F0F9FF" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="90" y="735" font-size="14" font-weight="700" fill="#1E293B">Flow 6 · 个人中心（5屏）</text>
  <text x="90" y="755" font-size="12" fill="#64748B">S22 个人中心：用户信息+会员卡+功能入口 | 通知/邀请/设备/设置</text>
  <text x="90" y="775" font-size="12" fill="#64748B">S23 通知设置：系统消息开关 | 独立于报警设置</text>
  <text x="90" y="795" font-size="12" fill="#64748B">S24 邀请好友：邀请码+分享+记录 | 每成功1人各得50积分</text>

  <!-- 后台功能结构 -->
  <rect x="750" y="90" width="600" height="750" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="750" y="90" width="600" height="50" rx="16" fill="#10B981"/>
  <text x="1050" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">后台管理系统功能结构（15屏）</text>

  <!-- 后台模块1: 数据概览 -->
  <rect x="770" y="160" width="560" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="790" y="185" font-size="14" font-weight="700" fill="#1E293B">模块1 · 数据概览 Dashboard（2屏）</text>
  <text x="790" y="205" font-size="12" fill="#64748B">核心指标卡：DAU/MAU/设备在线率/报警率/收入趋势 | 7/30/90天切换</text>
  <text x="790" y="225" font-size="12" fill="#64748B">报警热力图：地图展示报警高发区域 | 实时监控：10秒自动刷新</text>

  <!-- 模块2: 用户管理 -->
  <rect x="770" y="250" width="560" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="790" y="275" font-size="14" font-weight="700" fill="#1E293B">模块2 · 用户管理（2屏）</text>
  <text x="790" y="295" font-size="12" fill="#64748B">用户列表：多维筛选+批量操作+封禁/解封 | 封禁即时生效</text>
  <text x="790" y="315" font-size="12" fill="#64748B">用户详情：宠物/设备/订单/报警4个Tab | 关联数据联动展示</text>

  <!-- 模块3: 设备管理 -->
  <rect x="770" y="340" width="560" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="790" y="365" font-size="14" font-weight="700" fill="#1E293B">模块3 · 设备管理（2屏）</text>
  <text x="790" y="385" font-size="12" fill="#64748B">设备列表：在线/离线/低电量筛选 | 支持固件批量推送</text>
  <text x="790" y="405" font-size="12" fill="#64748B">设备详情：绑定历史+定位轨迹+报警记录+固件日志 | 异常标红</text>

  <!-- 模块4: 报警管理 -->
  <rect x="770" y="430" width="560" height="70" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="790" y="455" font-size="14" font-weight="700" fill="#1E293B">模块4 · 报警管理（2屏）</text>
  <text x="790" y="475" font-size="12" fill="#64748B">报警规则配置：猫/狗独立默认规则 | 变更后下次报警生效</text>
  <text x="790" y="495" font-size="12" fill="#64748B">报警记录：按类型/时间/状态筛选 | 误报标记用于优化算法</text>

  <!-- 模块5: 社交管理 -->
  <rect x="770" y="520" width="560" height="70" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="790" y="545" font-size="14" font-weight="700" fill="#1E293B">模块5 · 社交管理（2屏）</text>
  <text x="790" y="565" font-size="12" fill="#64748B">碰头记录审核：异常碰头标红（距离<50m/频繁）| 审核不通过扣积分</text>
  <text x="790" y="585" font-size="12" fill="#64748B">积分规则配置：获取/消费规则+过期策略 | 变更实时生效</text>

  <!-- 模块6: 会员营收 -->
  <rect x="770" y="610" width="560" height="70" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="790" y="635" font-size="14" font-weight="700" fill="#1E293B">模块6 · 会员与营收（2屏）</text>
  <text x="790" y="655" font-size="12" fill="#64748B">会员方案管理：三档方案+功能对比 | 价格变更需审批</text>
  <text x="790" y="675" font-size="12" fill="#64748B">订单列表：按状态/类型筛选 | 退款需审批+通知用户</text>

  <!-- 模块7: 内容管理 -->
  <rect x="770" y="700" width="560" height="70" rx="10" fill="#F0F9FF" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="790" y="725" font-size="14" font-weight="700" fill="#1E293B">模块7 · 内容管理（2屏）</text>
  <text x="790" y="745" font-size="12" fill="#64748B">公告管理：定时发布+推送范围+置顶/下线 | 下次启动展示</text>
  <text x="790" y="765" font-size="12" fill="#64748B">Banner管理：首页Banner配置+链接+排序 | 下次刷新加载</text>

  <!-- 模块8: 系统设置 -->
  <rect x="770" y="790" width="560" height="40" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
  <text x="790" y="810" font-size="14" font-weight="700" fill="#1E293B">模块8 · 系统设置（1屏）| 模块9 · 宠物管理（2屏）</text>

  <!-- 底部连接线 -->
  <line x1="350" y1="850" x2="1050" y2="850" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="700" y="870" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">数据联动：前端操作 → API接口 → 后台管理 → 运营决策</text>

</svg>